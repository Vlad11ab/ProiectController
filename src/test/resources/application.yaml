spring:
  datasource:
    url: jdbc:mysql://localhost:3307/proiectController?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariPool
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 60000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

application:
  jwt:
    tokenPrefix: "Bearer"
    tokenExpirationAfterDays: 7
    secretKey: testSecretKeyForTestingPurposesOnly1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ
